<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Bookmark AI frame</title>
</head>
<body>
  <script>
    // New Tab Canvas — the SANDBOX FRAME (docs/features/newtab-canvas.md §4.4/§5).
    //
    // Why this page exists: user-authored template HTML contains inline
    // <script> — and inline scripts are banned under the extension_pages CSP
    // that governs every chrome-extension:// document (MV3). The ONLY Chrome
    // primitive whose CSP may opt into 'unsafe-inline' is a page listed in the
    // manifest's `sandbox.pages`, under `content_security_policy.sandbox`:
    //
    //   sandbox { pages: ["newtab-frame.html"] }
    //   content_security_policy.sandbox:
    //     "sandbox allow-scripts; script-src 'self' 'unsafe-inline'; … connect-src 'none';"
    //
    // The `sandbox` CSP directive (allow-scripts, NO allow-same-origin) gives
    // this page an OPAQUE origin (event.origin === "null"): the template can
    // run scripts and postMessage — and nothing else. No chrome.*, no cookies,
    // no storage, no network (connect-src 'none'). Treat every host/comms
    // step here as hostile-input plumbing:
    //
    //  - The ONLY inbound message the frame honors is
    //    { type: "newtab:render", html }, and only from its embedder
    //    (event.source === parent). The renderer then becomes the template
    //    document via document.write — arbitrary HTML, but sandboxed.
    //  - The template answers its own data needs by postMessage-ing the parent
    //    newtab page (the fixed bridgeRequestSchema vocabulary), which the
    //    parent's bridge validates and routes. NOTHING in this file answers
    //    template messages directly — the bridge in the parent does, with
    //    the same source guard.
    //  - 200_000-char cap re-enforced here so a malformed render message
    //    can't bypass the API-layer bound (§5.4).
    (function () {
      // Announce readiness: the parent (re)sends the template HTML on each
      // navigation of this frame ("frame:ready" is NOT part of the template
      // vocabulary — the parent's bridge drops unknown types by design).
      if (window.parent !== window) {
        window.parent.postMessage({ type: "frame:ready" }, "*");
      }

      window.addEventListener("message", function (e) {
        if (e.source !== window.parent) return; // spliced-in rogue frame — drop
        var d = e.data;
        if (!d || typeof d !== "object") return;
        if (d.type !== "newtab:render") return;
        if (typeof d.html !== "string" || d.html.length === 0 || d.html.length > 200000) return;
        document.open();
        document.write(d.html);
        document.close();
      });
    })();
  </script>
</body>
</html>
