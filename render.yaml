# Render blueprint — Bookmark AI Express API (apps/server).
#
# Deploy: push this file to GitHub, then in the Render dashboard choose
# New → Blueprint and connect the Tarachand-Gupta/bookmark-ai repo. Render
# reads this file and provisions the service, prompting once for the three
# secret env vars below (sync:false → entered in the dashboard, never in git).
#
# The DB is Turso cloud, so the service is stateless (no disk). Region is
# Singapore — the Render region closest to the Turso DB in aws-ap-south-1.
services:
  - type: web
    name: bookmark-ai-server
    runtime: node
    region: singapore
    plan: free
    # Install from the monorepo root so `workspace:*` deps (db, types) link.
    # --prod=false forces tsx + typescript (devDependencies) to install: the
    # server runs via `tsx src/index.ts`, so without them `start` can't launch.
    buildCommand: pnpm install --prod=false
    startCommand: pnpm --filter @bookmark-ai/server start
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      # Pin Node ≥20 (repo requires it); Render otherwise picks its default.
      - key: NODE_VERSION
        value: "20"
      # Secrets — Render prompts for these on first deploy; keep out of git.
      - key: GEMINI_API_KEY
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: DATABASE_AUTH_TOKEN
        sync: false
