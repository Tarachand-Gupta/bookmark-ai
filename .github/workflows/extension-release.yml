name: extension release

# Builds the browser extension (Chrome MV3 + Firefox MV2) and, on pushes to main,
# publishes the Chrome build to the Chrome Web Store using the CWS API v2 directly
# (no third-party marketplace actions — just curl + the Google OAuth refresh flow).
#
# TRIGGERS
#   - push to main touching the extension or its shared contract → verify+build,
#     and auto-publish to CWS *if* the four CWS_* secrets are present.
#   - workflow_dispatch → verify+build always; publish only when the `publish`
#     input is true (and the secrets are present) — so a manual run is build-only
#     by default.
#
# ONE-TIME SETUP + secret list: see apps/extension/RELEASING.md.
#
# GITHUB RELEASE (job `github-release`, no secrets needed — GITHUB_TOKEN only):
#   attaches the three sideload/AMO zips built by `release:zip` — chrome, firefox
#   and the AMO sources zip — to the GitHub Release `extension-v<version>`
#   (version = apps/extension/package.json). On a push to main it runs ONLY when
#   that tag does not exist yet (so every version is released once, and a fix
#   pushed under the same version leaves the published release alone); on a
#   dispatch it always creates-or-updates (assets --clobber). The
#   `*-chrome-store.zip` (contains the private key.pem, needs .keys/ which CI
#   never has) is asserted ABSENT — it must never be attached to a release.
#
# Required repo secrets for the publish job (job is skipped if any is missing):
#   CWS_EXTENSION_ID  — the item id from the Chrome Web Store dashboard URL
#   CWS_CLIENT_ID     — Google OAuth 2.0 client id (Desktop app)
#   CWS_CLIENT_SECRET — Google OAuth 2.0 client secret
#   CWS_REFRESH_TOKEN — long-lived refresh token minted once for that client

on:
  push:
    branches: [main]
    paths:
      - "apps/extension/**"
      - "packages/types/**"
      - ".github/workflows/extension-release.yml"
  workflow_dispatch:
    inputs:
      publish:
        description: "Publish the Chrome build to the Web Store (requires CWS_* secrets)"
        type: boolean
        default: false

jobs:
  verify-build:
    runs-on: ubuntu-latest
    outputs:
      # Whether all four CWS_* secrets are set — secrets can't be read in a job-level
      # `if:`, so we surface their presence as an output the publish job gates on.
      can_publish: ${{ steps.secret_check.outputs.present }}
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.34.1

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install (extension subgraph)
        run: pnpm --filter @bookmark-ai/extension... install --frozen-lockfile

      - name: Test
        run: pnpm --filter @bookmark-ai/extension test

      - name: Type-check
        run: pnpm --filter @bookmark-ai/extension check-types

      - name: Build + zip (chrome)
        run: pnpm --filter @bookmark-ai/extension zip

      - name: Build + zip (firefox)
        run: pnpm --filter @bookmark-ai/extension zip:firefox

      - name: AMO sources zip (no key material — the script asserts it)
        # `--sources-only` skips the chrome-store zip, which needs .keys/crx-key.pem
        # (never present in CI) and must never leave this machine anyway.
        run: pnpm --filter @bookmark-ai/extension zip:store --sources-only

      - name: Assert the zips carry no private key
        working-directory: apps/extension/.output
        run: |
          set -euo pipefail
          ls -la *.zip
          if ls *-chrome-store.zip >/dev/null 2>&1; then echo "::error::a *-chrome-store.zip (contains key.pem) was built in CI"; exit 1; fi
          for z in *.zip; do
            if unzip -Z1 "$z" | grep -Eq '(^|/)(key\.pem|.*\.pem|\.keys/.*|\.env|\.env\.local)$'; then
              echo "::error::$z contains key/env material"; unzip -Z1 "$z" | grep -E '\.pem|\.keys|\.env'; exit 1
            fi
          done
          echo "OK: $(ls *.zip | wc -l | tr -d ' ') zips, no key material"

      - name: Upload store zips
        uses: actions/upload-artifact@v4
        with:
          name: extension-zips
          path: apps/extension/.output/*.zip
          if-no-files-found: error
          # `.output` is a dot-dir; upload-artifact@v4 skips hidden paths by
          # default, which made this step "find no files" while both zips existed.
          include-hidden-files: true
          retention-days: 30

      - name: Detect CWS secrets
        id: secret_check
        env:
          CWS_EXTENSION_ID: ${{ secrets.CWS_EXTENSION_ID }}
          CWS_CLIENT_ID: ${{ secrets.CWS_CLIENT_ID }}
          CWS_CLIENT_SECRET: ${{ secrets.CWS_CLIENT_SECRET }}
          CWS_REFRESH_TOKEN: ${{ secrets.CWS_REFRESH_TOKEN }}
        run: |
          if [ -n "$CWS_EXTENSION_ID" ] && [ -n "$CWS_CLIENT_ID" ] \
             && [ -n "$CWS_CLIENT_SECRET" ] && [ -n "$CWS_REFRESH_TOKEN" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
            echo "All four CWS_* secrets present — publish job is eligible to run."
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "One or more CWS_* secrets missing — publish job will be skipped."
          fi

  publish-chrome:
    needs: verify-build
    runs-on: ubuntu-latest
    # Publish only when: all four CWS_* secrets exist AND
    #   - this was a push to main (auto-publish), OR
    #   - this was a manual dispatch with publish=true.
    if: >
      needs.verify-build.outputs.can_publish == 'true' &&
      (github.event_name == 'push' ||
       (github.event_name == 'workflow_dispatch' && github.event.inputs.publish == 'true'))
    steps:
      - name: Download store zips
        uses: actions/download-artifact@v4
        with:
          name: extension-zips
          path: dist

      - name: Locate the chrome zip
        id: zip
        run: |
          set -euo pipefail
          zip="$(ls dist/*-chrome.zip 2>/dev/null | head -n1 || true)"
          if [ -z "$zip" ]; then
            echo "No *-chrome.zip found in the downloaded artifact:"
            ls -la dist || true
            exit 1
          fi
          echo "Publishing zip: $zip"
          echo "path=$zip" >> "$GITHUB_OUTPUT"

      - name: Publish to the Chrome Web Store
        env:
          CWS_EXTENSION_ID: ${{ secrets.CWS_EXTENSION_ID }}
          CWS_CLIENT_ID: ${{ secrets.CWS_CLIENT_ID }}
          CWS_CLIENT_SECRET: ${{ secrets.CWS_CLIENT_SECRET }}
          CWS_REFRESH_TOKEN: ${{ secrets.CWS_REFRESH_TOKEN }}
          ZIP_PATH: ${{ steps.zip.outputs.path }}
        run: |
          set -euo pipefail

          echo "::group::Refresh OAuth access token"
          # Exchange the long-lived refresh token for a short-lived access token.
          token_resp="$(curl -sS -X POST "https://accounts.google.com/o/oauth2/token" \
            -d "client_id=${CWS_CLIENT_ID}" \
            -d "client_secret=${CWS_CLIENT_SECRET}" \
            -d "refresh_token=${CWS_REFRESH_TOKEN}" \
            -d "grant_type=refresh_token")"
          access_token="$(printf '%s' "$token_resp" | python3 -c 'import sys,json; print(json.load(sys.stdin).get("access_token",""))')"
          if [ -z "$access_token" ]; then
            echo "Failed to obtain access token. Response:"
            # Never print the raw response (may echo token material); show error fields only.
            printf '%s' "$token_resp" | python3 -c 'import sys,json; d=json.load(sys.stdin); print({k:d.get(k) for k in ("error","error_description")})' || echo "(unparseable token response)"
            exit 1
          fi
          echo "Access token acquired."
          echo "::endgroup::"

          echo "::group::Upload new package"
          upload_resp="$(curl -sS \
            -X PUT \
            -H "Authorization: Bearer ${access_token}" \
            -H "x-goog-api-version: 2" \
            -T "${ZIP_PATH}" \
            "https://www.googleapis.com/upload/chromewebstore/v1.1/items/${CWS_EXTENSION_ID}")"
          echo "Upload response:"
          echo "${upload_resp}"
          upload_state="$(printf '%s' "$upload_resp" | python3 -c 'import sys,json; print(json.load(sys.stdin).get("uploadState",""))' 2>/dev/null || true)"
          # uploadState is SUCCESS on a clean upload; IN_PROGRESS is also acceptable
          # (CWS finishes processing async). Anything else (e.g. FAILURE) is fatal.
          case "$upload_state" in
            SUCCESS|IN_PROGRESS)
              echo "Upload accepted (state: $upload_state)."
              ;;
            *)
              echo "Upload FAILED (state: '$upload_state'). See response above."
              exit 1
              ;;
          esac
          echo "::endgroup::"

          echo "::group::Publish"
          publish_resp="$(curl -sS \
            -X POST \
            -H "Authorization: Bearer ${access_token}" \
            -H "x-goog-api-version: 2" \
            -H "Content-Length: 0" \
            "https://www.googleapis.com/chromewebstore/v1.1/items/${CWS_EXTENSION_ID}/publish")"
          echo "Publish response:"
          echo "${publish_resp}"
          # The publish endpoint returns { "status": [...], "statusDetail": [...] }.
          # OK means queued for review/publish; anything else is fatal.
          publish_ok="$(printf '%s' "$publish_resp" | python3 -c 'import sys,json; d=json.load(sys.stdin); s=d.get("status",[]); print("OK" if "OK" in s else "NOT_OK")' 2>/dev/null || echo NOT_OK)"
          if [ "$publish_ok" != "OK" ]; then
            echo "Publish did NOT return an OK status. See response above."
            exit 1
          fi
          echo "Published — item queued by the Chrome Web Store (may require review before going live)."
          echo "::endgroup::"

  github-release:
    # Attach the chrome / firefox / sources zips to the GitHub Release
    # `extension-v<version>`. push→main: only if that tag is new; dispatch: always.
    needs: verify-build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Resolve version + whether the tag exists
        id: ver
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          version="$(node -p 'require("./apps/extension/package.json").version')"
          tag="extension-v$version"
          if git ls-remote --exit-code --tags origin "refs/tags/$tag" >/dev/null 2>&1; then exists=true; else exists=false; fi
          if [ "${{ github.event_name }}" = "push" ] && [ "$exists" = "true" ]; then
            echo "Tag $tag already exists — push to main does not re-release. Dispatch the workflow to update it."
            echo "run=false" >> "$GITHUB_OUTPUT"
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "exists=$exists" >> "$GITHUB_OUTPUT"

      - name: Download zips
        if: steps.ver.outputs.run == 'true'
        uses: actions/download-artifact@v4
        with:
          name: extension-zips
          path: dist

      - name: Pick the three release assets (never the chrome-store zip)
        if: steps.ver.outputs.run == 'true'
        id: assets
        run: |
          set -euo pipefail
          v="${{ steps.ver.outputs.version }}"
          ls -la dist
          if ls dist/*-chrome-store.zip >/dev/null 2>&1; then echo "::error::refusing: a *-chrome-store.zip (private key inside) is present"; exit 1; fi
          chrome="dist/bookmark-aiextension-$v-chrome.zip"
          firefox="dist/bookmark-aiextension-$v-firefox.zip"
          sources="dist/bookmark-aiextension-$v-sources.zip"
          for f in "$chrome" "$firefox" "$sources"; do
            [ -f "$f" ] || { echo "::error::missing $f — does package.json version match the built zips?"; exit 1; }
            unzip -Z1 "$f" | grep -Eq '\.pem$|(^|/)\.keys/' && { echo "::error::$f contains key material"; exit 1; }
          done
          (cd dist && shasum -a 256 "$(basename "$chrome")" "$(basename "$firefox")" "$(basename "$sources")" | tee "bookmark-aiextension-$v-SHA256SUMS.txt")
          echo "files=$chrome $firefox $sources dist/bookmark-aiextension-$v-SHA256SUMS.txt" >> "$GITHUB_OUTPUT"

      - name: Release notes
        if: steps.ver.outputs.run == 'true'
        run: |
          v="${{ steps.ver.outputs.version }}"
          cat > dist/notes.md <<EOF
          # Bookmark AI browser extension $v

          Save the current tab (or a whole window as a session) to your Bookmark AI library. Signs in by mirroring
          your https://www.bookmark-ai.cloud session — no in-extension sign-in.

          | File | Use |
          | --- | --- |
          | \`bookmark-aiextension-$v-chrome.zip\` | Chrome / Edge / Brave (MV3). Unzip, then **chrome://extensions ▸ Developer mode ▸ Load unpacked** and pick the folder. The Chrome Web Store listing is the recommended install when available. |
          | \`bookmark-aiextension-$v-firefox.zip\` | Firefox (MV2, id \`bookmark-ai@purecode.ai\`). Temporary load via **about:debugging ▸ This Firefox ▸ Load Temporary Add-on**; a permanent install needs the AMO-signed build. |
          | \`bookmark-aiextension-$v-sources.zip\` | Reproducible source of the Firefox build (\`BUILD.md\` inside) — what is uploaded to AMO's source-code review. |

          Verify: \`shasum -a 256 -c bookmark-aiextension-$v-SHA256SUMS.txt\`.
          EOF

      - name: Create or update the GitHub Release
        if: steps.ver.outputs.run == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.ver.outputs.tag }}
        run: |
          set -euo pipefail
          if [ "${{ steps.ver.outputs.exists }}" = "true" ]; then
            gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --notes-file dist/notes.md \
              --title "Bookmark AI extension ${{ steps.ver.outputs.version }}"
          else
            gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
              --title "Bookmark AI extension ${{ steps.ver.outputs.version }}" --notes-file dist/notes.md
          fi
          gh release upload "$TAG" --repo "$GITHUB_REPOSITORY" --clobber ${{ steps.assets.outputs.files }}
          echo "https://github.com/$GITHUB_REPOSITORY/releases/tag/$TAG"
