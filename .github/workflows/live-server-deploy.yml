name: live-server deploy

# Builds the Live Sessions server and deploys it to the OCI ARM VM over SSH,
# mirroring the manual systemd/rsync flow (there is NO Docker on that VM). The
# server is pure-JS (Fastify + ioredis + @clerk/backend, no native bindings), so a
# CI-built node_modules runs as-is on ARM64. Triggered on pushes that touch the
# server or its shared contract.
#
# Required repo secrets:
#   VM_HOST     — the VM's IP / hostname (129.146.3.172)
#   VM_USER     — SSH user (ubuntu)
#   VM_SSH_KEY  — private key of the dedicated deploy key authorized on the VM
#   VM_APP_DIR  — deploy target on the VM (/home/ubuntu/bookmark-live)
#
# On the VM: systemd unit `bookmark-live.service` runs `node dist/server.js`
# reading /home/ubuntu/bookmark-live/.env (never synced — see the rsync --exclude).
# Caddy fronts it on live.bookmark-ai.cloud / live.129.146.3.172.sslip.io.

on:
  push:
    branches: [main, live-sessions]
    paths:
      - "apps/live-server/**"
      - "packages/types/**"
      - ".github/workflows/live-server-deploy.yml"
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.34.1

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install (live-server subgraph)
        run: pnpm --filter @bookmark-ai/live-server... install --frozen-lockfile

      - name: Build
        run: pnpm --filter @bookmark-ai/live-server build

      - name: Assemble self-contained deploy dir
        run: |
          rm -rf out
          pnpm --filter=@bookmark-ai/live-server --legacy deploy --prod out
          # `dist` is gitignored, so `pnpm deploy` skips it — copy the fresh build in.
          cp -R apps/live-server/dist out/dist

      - name: Set up SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.VM_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "${{ secrets.VM_HOST }}" >> ~/.ssh/known_hosts 2>/dev/null

      - name: Rsync to VM (never clobber the VM .env)
        run: |
          rsync -az --delete \
            --exclude='.env' \
            -e "ssh -i ~/.ssh/deploy_key -o IdentitiesOnly=yes" \
            out/ "${{ secrets.VM_USER }}@${{ secrets.VM_HOST }}:${{ secrets.VM_APP_DIR }}/"

      - name: Ensure device-token secret in VM env
        # Idempotently upsert DEVICE_TOKEN_SECRET into the VM's .env (never synced
        # by rsync). The extension's device tokens are HMAC-signed with this shared
        # secret; the live server verifies them offline. GH masks the secret in logs;
        # we still avoid echoing it (no `set -x`, value passed via an env var).
        env:
          DEVICE_TOKEN_SECRET: ${{ secrets.LIVE_DEVICE_TOKEN_SECRET }}
        run: |
          if [ -z "$DEVICE_TOKEN_SECRET" ]; then
            echo "LIVE_DEVICE_TOKEN_SECRET not set — skipping"
            exit 0
          fi
          ssh -i ~/.ssh/deploy_key -o IdentitiesOnly=yes \
            "${{ secrets.VM_USER }}@${{ secrets.VM_HOST }}" \
            "DEVICE_TOKEN_SECRET='$DEVICE_TOKEN_SECRET' ENV_FILE='${{ secrets.VM_APP_DIR }}/.env' sh -s" <<'REMOTE'
          set -eu
          # A hand-edited .env whose last line has NO trailing newline would otherwise
          # get the new assignment GLUED onto it (`FOO=barDEVICE_TOKEN_SECRET=…`),
          # silently corrupting both vars. `$(tail -c1 …)` strips trailing newlines, so
          # it is empty exactly when the file already ends in one (and for an empty
          # file, where a leading blank line would be wrong). Written as `if` — not an
          # `&&` chain — so a false condition never trips `set -e`.
          end_with_newline() {
            if [ -s "$1" ] && [ -n "$(tail -c1 "$1")" ]; then echo >> "$1"; fi
          }
          touch "$ENV_FILE"
          line="DEVICE_TOKEN_SECRET=$DEVICE_TOKEN_SECRET"
          if grep -q '^DEVICE_TOKEN_SECRET=' "$ENV_FILE"; then
            current=$(grep '^DEVICE_TOKEN_SECRET=' "$ENV_FILE" | head -n1 | cut -d= -f2-)
            if [ "$current" = "$DEVICE_TOKEN_SECRET" ]; then
              echo "DEVICE_TOKEN_SECRET already up to date"
            else
              tmp=$(mktemp)
              grep -v '^DEVICE_TOKEN_SECRET=' "$ENV_FILE" > "$tmp" || true
              end_with_newline "$tmp"
              printf '%s\n' "$line" >> "$tmp"
              mv "$tmp" "$ENV_FILE"
              echo "DEVICE_TOKEN_SECRET updated"
            fi
          else
            end_with_newline "$ENV_FILE"
            printf '%s\n' "$line" >> "$ENV_FILE"
            echo "DEVICE_TOKEN_SECRET appended"
          fi
          REMOTE

      - name: Ensure live-encryption secret in VM env
        # Idempotently upsert LIVE_ENCRYPTION_SECRET into the VM's .env (never synced
        # by rsync). AES-256-GCM key that encrypts live-tab `windowsJson` at rest in
        # Redis (base64, 32 bytes). If unset, the server degrades to plaintext-with-warn
        # (no breakage) — so this step is a no-op skip until the secret exists. A secret
        # that IS set but does not decode to 32 bytes makes the server REFUSE TO BOOT
        # (config.ts) rather than silently store plaintext, and the health check below
        # turns the deploy red. GH masks the value in logs; we still avoid echoing it
        # (no `set -x`, passed via env var).
        env:
          LIVE_ENCRYPTION_SECRET: ${{ secrets.LIVE_ENCRYPTION_SECRET }}
        run: |
          if [ -z "$LIVE_ENCRYPTION_SECRET" ]; then
            echo "LIVE_ENCRYPTION_SECRET not set — skipping (live tabs store plaintext)"
            exit 0
          fi
          ssh -i ~/.ssh/deploy_key -o IdentitiesOnly=yes \
            "${{ secrets.VM_USER }}@${{ secrets.VM_HOST }}" \
            "LIVE_ENCRYPTION_SECRET='$LIVE_ENCRYPTION_SECRET' ENV_FILE='${{ secrets.VM_APP_DIR }}/.env' sh -s" <<'REMOTE'
          set -eu
          # A hand-edited .env whose last line has NO trailing newline would otherwise
          # get the new assignment GLUED onto it (`FOO=barLIVE_ENCRYPTION_SECRET=…`),
          # silently corrupting both vars — and a corrupt LIVE_ENCRYPTION_SECRET is now
          # a hard boot failure (config.ts), so this would take the service down.
          # `$(tail -c1 …)` strips trailing newlines, so it is empty exactly when the
          # file already ends in one (and for an empty file, where a leading blank line
          # would be wrong). Written as `if` — not an `&&` chain — so a false condition
          # never trips `set -e`.
          end_with_newline() {
            if [ -s "$1" ] && [ -n "$(tail -c1 "$1")" ]; then echo >> "$1"; fi
          }
          touch "$ENV_FILE"
          line="LIVE_ENCRYPTION_SECRET=$LIVE_ENCRYPTION_SECRET"
          if grep -q '^LIVE_ENCRYPTION_SECRET=' "$ENV_FILE"; then
            current=$(grep '^LIVE_ENCRYPTION_SECRET=' "$ENV_FILE" | head -n1 | cut -d= -f2-)
            if [ "$current" = "$LIVE_ENCRYPTION_SECRET" ]; then
              echo "LIVE_ENCRYPTION_SECRET already up to date"
            else
              tmp=$(mktemp)
              grep -v '^LIVE_ENCRYPTION_SECRET=' "$ENV_FILE" > "$tmp" || true
              end_with_newline "$tmp"
              printf '%s\n' "$line" >> "$tmp"
              mv "$tmp" "$ENV_FILE"
              echo "LIVE_ENCRYPTION_SECRET updated"
            fi
          else
            end_with_newline "$ENV_FILE"
            printf '%s\n' "$line" >> "$ENV_FILE"
            echo "LIVE_ENCRYPTION_SECRET appended"
          fi
          REMOTE

      - name: Restart service (our unit only — never touch Caddy)
        run: |
          ssh -i ~/.ssh/deploy_key -o IdentitiesOnly=yes \
            "${{ secrets.VM_USER }}@${{ secrets.VM_HOST }}" \
            'sudo systemctl restart bookmark-live && sleep 2 && systemctl is-active bookmark-live'

      - name: Post-deploy health check
        run: |
          for i in $(seq 1 6); do
            body=$(curl -fsS --max-time 20 https://live.129.146.3.172.sslip.io/health) && \
              echo "health: $body" && exit 0
            echo "retry $i..."; sleep 5
          done
          echo "health check failed"; exit 1
