name: live-server deploy

# Builds the Live Sessions server image, pushes it to GHCR, and deploys it to the
# VM over SSH. Triggered on pushes that touch the server or its shared contract.
#
# Required repo secrets:
#   VM_HOST         — the VM's hostname/IP
#   VM_USER         — SSH user
#   VM_SSH_KEY      — private key for that user (deploy key)
#   VM_APP_DIR      — path to the checked-out repo on the VM (contains apps/live-server/.env)
# GHCR auth uses the built-in GITHUB_TOKEN (packages: write).

on:
  push:
    branches: [main, live-sessions]
    paths:
      - "apps/live-server/**"
      - "packages/types/**"
      - ".github/workflows/live-server-deploy.yml"
  workflow_dispatch:

env:
  IMAGE: ghcr.io/tarachand-gupta/bookmark-ai-live-server

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      sha: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/live-server/Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USER }}
          key: ${{ secrets.VM_SSH_KEY }}
          script: |
            set -euo pipefail
            cd "${{ secrets.VM_APP_DIR }}"
            git fetch origin
            git checkout ${{ github.sha }} -- apps/live-server docker-compose 2>/dev/null || true
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
            export LIVE_IMAGE_TAG=${{ github.sha }}
            docker compose -p live-prod -f apps/live-server/docker-compose.live.yml pull live-server
            docker compose -p live-prod -f apps/live-server/docker-compose.live.yml up -d --no-build
            docker image prune -f
